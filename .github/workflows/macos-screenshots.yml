name: macOS UI screenshots and Unikalizator check

# Запускается вручную или записью в MACOS_SCREENSHOT_REQUEST: снимки экранов macOS-клиента в режиме предпросмотра дизайна,
# сквозная проверка Уникализатора с настоящей докачкой FFmpeg для macOS и смоук-тест собранного .app.
on:
  push:
    paths:
      - "MACOS_SCREENSHOT_REQUEST"
      - ".github/workflows/macos-screenshots.yml"
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install worker dependencies
        working-directory: node_worker
        run: npm ci

      - name: Unikalizator end-to-end (real FFmpeg download for macOS)
        run: node node_worker/unik_e2e.mjs unik-e2e

      - name: Build macOS app
        run: swift build

      - name: Capture screens
        run: |
          mkdir -p shots
          for appearance in light dark; do
            for section in main reels unikalizator sorting settings; do
              args=""
              size="1500x1100"
              if [ "$section" = "unikalizator" ]; then args="--preview-samples"; size="1500x2300"; fi
              ./.build/debug/SaveMe --design-preview $args --preview-size=$size \
                --preview-section=$section --preview-appearance=$appearance \
                --preview-screenshot="$PWD/shots/$section-$appearance.png"
            done
          done
          # узкое окно: компактная раскладка
          ./.build/debug/SaveMe --design-preview --preview-samples --preview-size=980x1500 \
            --preview-section=unikalizator --preview-appearance=light \
            --preview-screenshot="$PWD/shots/unikalizator-narrow-light.png"
          # английский интерфейс
          for section in main unikalizator settings; do
            args=""
            size="1500x1100"
            if [ "$section" = "unikalizator" ]; then args="--preview-samples"; size="1500x2300"; fi
            ./.build/debug/SaveMe --design-preview $args --preview-language=en --preview-size=$size \
              --preview-section=$section --preview-appearance=light \
              --preview-screenshot="$PWD/shots/en-$section-light.png"
          done
          ls -l shots
          test "$(ls shots/*.png | wc -l)" -ge 14

      - name: Capture window screenshots for the repository (screencapture)
        run: |
          mkdir -p shots-repo
          capture() {
            name="$1"; section="$2"; appearance="$3"; language="$4"; size="$5"; extra="$6"
            rm -f "$RUNNER_TEMP/winid.txt"
            ./.build/debug/SaveMe --design-preview --preview-clean --preview-version=0.6.95 $extra --preview-language=$language --preview-size=$size \
              --preview-section=$section --preview-appearance=$appearance \
              --preview-window-id-file="$RUNNER_TEMP/winid.txt" &
            pid=$!
            for i in $(seq 1 60); do [ -s "$RUNNER_TEMP/winid.txt" ] && break; sleep 1; done
            sleep 2
            screencapture -x -o -l "$(cat "$RUNNER_TEMP/winid.txt")" "shots-repo/$name.png" || echo "screencapture failed for $name"
            kill $pid 2>/dev/null || true
            wait $pid 2>/dev/null || true
          }
          for appearance in light dark; do
            for section in main reels unikalizator sorting settings; do
              extra=""
              if [ "$section" = "unikalizator" ]; then extra="--preview-samples"; fi
              capture "$section-$appearance" "$section" "$appearance" ru "1500x700" "$extra"
            done
          done
          capture "en-main-light" main light en "1500x700" ""
          capture "en-unikalizator-light" unikalizator light en "1500x700" "--preview-samples"
          capture "fit-unikalizator-light" unikalizator light ru "1000x680" "--preview-samples"
          ls -l shots-repo

      - name: Build the .app bundle and smoke-test it
        run: |
          ./scripts/build_beta_app.sh
          APP="beta-build/release/SaveMe.app"
          test -x "$APP/Contents/MacOS/SaveMe"
          test "$(ls "$APP"/Contents/SharedSupport/node_worker/unik_assets/age-marks/*.png | wc -l)" -eq 54
          mkdir -p shots-app
          for section in main reels unikalizator sorting settings; do
            "$APP/Contents/MacOS/SaveMe" --design-preview --preview-size=1500x1100 \
              --preview-section=$section --preview-appearance=light \
              --preview-screenshot="$PWD/shots-app/$section.png"
          done
          test "$(ls shots-app/*.png | wc -l)" -eq 5
          echo '{"command":"unik_status"}' | node "$APP/Contents/SharedSupport/node_worker/bridge.mjs" | head -c 300

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: macos-screens
          path: |
            shots
            shots-app
            shots-repo
            unik-e2e/result
